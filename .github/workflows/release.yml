name: Test and build offline packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Install the application
        run: python -m pip install -e . --no-deps
      - name: Test the shared core and API
        run: python -m pytest -q
      - name: Build a relocatable Perl runtime
        if: runner.os == 'Linux'
        run: bash scripts/build_perl.sh
      - name: Prepare offline resources
        run: python scripts/prepare_resources.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Build the interface
        working-directory: frontend
        run: npm run build
      - name: Freeze, smoke-test and archive
        run: python scripts/build_release.py --skip-frontend --skip-resources
      - uses: actions/upload-artifact@v4
        with:
          name: media-organizer-${{ runner.os }}-x64
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error
