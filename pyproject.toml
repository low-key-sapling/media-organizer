[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-organizer"
version = "0.1.1"
description = "Offline, verifiable media organization for Windows and Linux"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pyinstaller>=6,<7"]

[project.scripts]
media-organizer = "media_organizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
